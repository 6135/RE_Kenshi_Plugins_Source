; Guard Break & Bash - release candidate
; KenshiLib is required.
;
; BalancePreset:
; 0 = Custom
; 1 = Recommended two-stage curve
; 2 = Growth-focused curve
; 3 = Vanilla-shaped curve
;
; Preset 1:
;   -60 or less = 2.5%
;   -30         = 7.5%
;     0         = 17.5%
;   +30         = 35.0%
;   +60 or more = 47.5%
;
; Presets 1-3 share:
; - equal-skill chance 17.5%
; - minimum 2.5%
; - maximum 47.5%

[General]
Enabled=1
BalancePreset=1

; 1 = Bash and GuardBreak are evaluated independently.
; 0 = GuardBreak is skipped if Bash was actually applied.
AllowBothEffects=1

[Stats]
; 0 = base stats
; 1 = effective/current stats including equipment and injuries
ValueMode=1

[Bash]
; On a successful block, the attacker may stumble.
Enabled=1

; Used only when BalancePreset=0.
BaseChance=17.5
MinimumChance=2.5
MaximumChance=47.5
NegativeMidDifference=30
NegativeMidChance=7.5
NegativeCapDifference=60
PositiveMidDifference=30
PositiveMidChance=35
PositiveCapDifference=60

CooldownMs=1500
ForceMultiplier=1.0
MinimumForce=10

[Bash.BlockerForce]
; 0 = max(Strength, Dexterity, Toughness)
ReferenceMode=0

; Used only when ReferenceMode=2.
StrengthWeight=1.0
DexterityWeight=1.0
ToughnessWeight=1.0

[Bash.AttackerResistance]
; 0 = max(Strength, Dexterity, Toughness)
ReferenceMode=0

; Used only when ReferenceMode=2.
StrengthWeight=1.0
DexterityWeight=1.0
ToughnessWeight=1.0

[GuardBreak]
; On a successful block, the blocker may stumble.
Enabled=1

; Used only when BalancePreset=0.
BaseChance=17.5
MinimumChance=2.5
MaximumChance=47.5
NegativeMidDifference=30
NegativeMidChance=7.5
NegativeCapDifference=60
PositiveMidDifference=30
PositiveMidChance=35
PositiveCapDifference=60

CooldownMs=1500
ForceMultiplier=1.0
MinimumForce=10

[GuardBreak.AttackerForce]
; 1 = max(Strength, Dexterity)
ReferenceMode=1

; Used only when ReferenceMode=2.
StrengthWeight=1.0
DexterityWeight=1.0
ToughnessWeight=0.0

[GuardBreak.BlockerResistance]
; 0 = max(Strength, Dexterity, Toughness)
ReferenceMode=0

; Used only when ReferenceMode=2.
StrengthWeight=1.0
DexterityWeight=1.0
ToughnessWeight=1.0

[Eligibility]
IgnoreAlreadyStumbling=1

[Safety]
TemplateMaxAgeMs=10000
MinimumTemplateObservations=1

[Logging]
; Release defaults: only warnings/startup information.
LogBlocks=0
LogStats=0
LogRolls=0
LogStagger=0
LogNativeTemplates=0
MaxLines=1000
