; ================================================================
; Partner Training
; Disabled combat profile templates
; ================================================================
;
; These profiles are examples for users and third-party mod authors.
; Every XP multiplier is 0.0, so they do not grant XP unless copied,
; renamed, and edited.
;
; XpMultiplier:
;   0.0 = disabled
;   1.0 = one configured Partner Training XP tick per trigger
;
; TeacherRatio:
;   Dynamic ceiling relative to the strongest current partner's
;   corresponding skill. Example: 0.50 = 50% of partner skill.
;
; Add a building in SourceData and set TrainingProfile=<ProfileName>.
; Weapon-class templates are stored in 91_WeaponTemplates.ini.
; ================================================================

[Metadata]
TrainingProfileVersion=1

; Complete reference containing every currently supported combat skill.
[Template_AllCombatSkills]
AttackXpMultiplier=0.0
