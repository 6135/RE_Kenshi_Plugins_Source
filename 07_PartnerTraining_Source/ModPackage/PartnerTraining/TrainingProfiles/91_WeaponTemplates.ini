; ================================================================
; Partner Training
; Disabled melee weapon profile templates
; ================================================================
;
; These profiles are examples for users and third-party mod authors.
; Every XP multiplier is 0.0, so they do not grant XP unless copied,
; renamed, and edited.
;
; XpMultiplier:
;   0.0 = disabled
;   1.0 = one configured Partner Training XP tick per trigger
;
; TeacherRatio:
;   Dynamic ceiling relative to the strongest current partner's
;   corresponding weapon skill. Example: 0.50 = 50% of partner skill.
;
; General combat, martial arts, crossbow, and turret templates are
; stored in 90_CombatTemplates.ini.
; ================================================================

