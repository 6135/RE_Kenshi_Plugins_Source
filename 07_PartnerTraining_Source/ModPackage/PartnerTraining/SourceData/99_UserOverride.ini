; ================================================================
; Partner Training
; User override layer - loaded last
; ================================================================
;
; Add or override supported training equipment here.
; Updates should preserve this file when possible.
;
; Combat skills are normally selected through TrainingProfile.
; Strength, Toughness, and Dexterity are optional equipment-level
; settings with absolute caps.
;
; Example:
;
; [My-Training-Building.mod]
; Enabled=true
; DisplayName=My Training Building
; TrainingProfile=Template_Katanas
; StrengthMultiplier=0.0
; StrengthCap=0.0
; ToughnessMultiplier=0.0
; ToughnessCap=0.0
; DexterityMultiplier=0.0
; DexterityCap=0.0

