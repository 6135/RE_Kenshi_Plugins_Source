; ================================================================
; Partner Training
; Disabled attribute template for users and third-party mod authors
; ================================================================
;
; Strength, Toughness, and Dexterity currently use equipment-level
; SourceData settings rather than TrainingProfile teacher ratios.
;
; Multiplier:
;   0.0 = disabled
;
; Cap:
;   Absolute displayed-skill ceiling for this equipment.
;
; Copy this example to 99_UserOverride.ini or another later-loading
; SourceData INI, replace the section name with an FCS building
; String ID, and change only the values you need.
; ================================================================

[Metadata]
SourceDataVersion=1

[Example-Attribute-Training-Building.mod]
Enabled=false
DisplayName=Attribute Training Template
TrainingProfile=Template_AllCombatSkills
StrengthMultiplier=0.0
StrengthCap=0.0
ToughnessMultiplier=0.0
ToughnessCap=0.0
DexterityMultiplier=0.0
DexterityCap=0.0
