; ================================================================
; Partner Training Framework
; Version 1.0.0 RC4
; ================================================================
;
; Global framework settings only.
;
; Bundled equipment mappings:
;   SourceData\00_OfficialMats.ini
;
; Bundled profiles and disabled examples:
;   TrainingProfiles\00_OfficialProfiles.ini
;   TrainingProfiles\90_CombatTemplates.ini
;   TrainingProfiles\91_WeaponTemplates.ini
;   SourceData\90_AttributeTemplates.ini
;
; Third-party mods may add later-loading INI files without editing
; these official files. Later files override earlier matching keys.
; ================================================================

[General]
; Master switch for this DLL.
Enabled=true

; File format version. Do not change.
ConfigVersion=1

; Multiplies all Partner Training XP configured by profiles.
GlobalXpMultiplier=1.0

; Multiplies all partner-relative skill ceilings.
; 1.0 keeps the ratios written in TrainingProfiles.
GlobalCapMultiplier=1.0

; false disables partner-relative ceiling checks.
EnableCaps=true

; Writes an INI stub when an unregistered usable source is detected.
; Useful for creating compatibility definitions.
GenerateUnknownSourcesIni=true

[Logging]
; Enables Partner Training log messages.
Enabled=true

; Public/default mode: false.
; true enables source internals, skill start/block events, and XP summaries.
DetailedLogging=false

; Labouring-hook diagnostics. Only used when DetailedLogging=true.
LogLabouringXp=false

; Diagnostic timing values. Usually no change is required.
SummaryIntervalMs=5000
SessionGapMs=1500
XpSummaryIntervalMs=5000

; Safety limit for optional diagnostic entries.
MaximumLogEntries=1000

[Defaults]
; Fallback physical-attribute settings for sources that omit them.
; Official Partner Training Mats keep all three disabled.
StrengthMultiplier=0.0
StrengthCap=0.0
ToughnessMultiplier=0.0
ToughnessCap=0.0
DexterityMultiplier=0.0
DexterityCap=0.0
