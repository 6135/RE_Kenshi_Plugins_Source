; ================================================================
; Multi XP - Mining
; Release Candidate 4 configuration
; ================================================================
;
; XP calculation:
;   Labouring XP ticks x source multiplier x GlobalXpMultiplier
;
; Cap calculation:
;   source cap x GlobalCapMultiplier
;
; A multiplier of 1.0 means the same number of raw time-based XP
; ticks as the character receives for Labouring.
; ================================================================

[General]
ConfigVersion=1
Enabled=true
GlobalXpMultiplier=1.0
GlobalCapMultiplier=1.0
EnableCaps=true
GenerateUnknownSourcesIni=true

[Defaults]
; Used only when a SourceData entry omits a value.
StrengthMultiplier=0.25
StrengthCap=15.0
ToughnessMultiplier=0.0
ToughnessCap=0.0
DexterityMultiplier=0.0
DexterityCap=0.0

[Logging]
Enabled=true
DetailedLogging=false
LogLabouringXp=false
SummaryIntervalMs=5000
SessionGapMs=1500
MaximumLogEntries=1000
XpSummaryIntervalMs=5000
