; ============================================================================
; Multi XP - Training user overrides
;
; Later files override earlier files item by item.
; Copy only the section and keys you want to change.
;
; Example: enable Heavy Weapons on Training Dummy Mk I
;
; [898-gamedata.base]
; HeavyWeaponsMultiplier=1.0
; HeavyWeaponsCap=5.0
;
; Available optional skill names:
; Strength, Toughness, Dexterity,
; MeleeAttack, MeleeDefense, Dodge, MartialArts,
; Katanas, Sabres, Hackers, Blunt, Polearms, HeavyWeapons,
; Crossbows, PrecisionShooting, Perception,
; Lockpicking, Thieving, Assassination, Turrets
; ============================================================================
