; ============================================================================
; Multi XP - Training
; Vanilla training equipment defaults
;
; Multiplier 1.0 = the same xpTraining rate as the equipment's native skill.
; Cap = maximum displayed skill level trainable by this added XP source.
;
; Default design:
; - Training dummies add Melee Defense and Dodge at equal rates.
; - Training turrets add Crossbows, Precision Shooting and Perception.
; - Lockpicking, Assassination and Thieving equipment currently keep all
;   additional skills OFF until their Dexterity balance is finalized.
; - Every optional combat/weapon skill can be enabled through UserOverride.
; ============================================================================

