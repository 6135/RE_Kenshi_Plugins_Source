; Nutritious Food v1.0 RC2
; Release Candidate 1. Feature scope is frozen; only bug fixes and documentation changes are allowed.

[General]
Enabled = true
AffectAnimals = true

[Recursion]
MaximumDepth = 16
MaximumIngredientsPerItem = 64
RatioDivisor = 100
CalculateOnlyOncePerSID = false

[Performance]
EnableNutritionCache = true

[Balance]
; Global multiplier applied after each Effect multiplier.
; 0.10 = recommended default for a subtle, long-term flavor effect.
; 0.50 = stronger progression.
; 1.00 = original development-test strength.
; 0.00 = disable all Nutritious Food XP without disabling food detection.
GlobalExperienceMultiplier = 0.10

[Logging]
LogEatCalls = false
LogTree = false
LogUnknownTerminalIngredients = true
LogDataLoading = true

; Detailed balance diagnostics. Enable during testing or compatibility reports.
; false: startup/data warnings and optional EatItem lines only.
; true: calculated attributes, multipliers, requested XP, and before/after stats.
LogBalanceInfo = false

; Attribute-to-stat mappings. Data packs define ingredient attributes.
[Effect.Power]
Type = Experience
Enabled = true
Stat = Strength
Multiplier = 10
MaximumXPPerMeal = 1000

[Effect.Endurance]
Type = Experience
Enabled = true
Stat = Toughness
Multiplier = 10
MaximumXPPerMeal = 1000

[Effect.Technique]
Type = Experience
Enabled = true
Stat = Dexterity
Multiplier = 10
MaximumXPPerMeal = 1000

[Effect.Awareness]
Type = Experience
Enabled = true
Stat = Perception
Multiplier = 10
MaximumXPPerMeal = 1000
