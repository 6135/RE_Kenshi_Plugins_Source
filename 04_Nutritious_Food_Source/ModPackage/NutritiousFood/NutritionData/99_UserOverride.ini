; 99_UserOverride.ini
; Optional user overrides for Nutritious Food.
; This file is intentionally inactive by default.
;
; Copy a section from 00_Vanilla.ini, remove the leading semicolons,
; and change only the values you want to override.
;
; Example:
;
; [BaseIngredient.1913-gamedata.base]
; Power = 0
; Endurance = 2
; Technique = 0
; Awareness = 0
;
; Files are loaded in ascending filename order. Later definitions win
; per SID and attribute, so this 99_ file overrides earlier data packs.
