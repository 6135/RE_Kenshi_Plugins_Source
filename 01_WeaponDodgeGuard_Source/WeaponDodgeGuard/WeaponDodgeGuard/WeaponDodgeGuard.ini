; Weapon Dodge & Guard v1.2.0-rc1
; Restart Kenshi after changing this file.

[General]
Mode=1

[Dodge]
ChanceScale=1.0
MinimumChance=0.0
MaximumChance=95.0

[Priority]
; Optional Adaptive Priority.
;
; 0 / false = Off (default, same behavior as previous versions)
; 1 / true  = On
;
; When enabled:
;   Effective Dodge >= Effective Melee Defence
;     -> Weapon Dodge works normally.
;
;   Effective Dodge < Effective Melee Defence
;     -> Weapon Dodge does not add its pre-block dodge for that attack.
;        Kenshi's original weapon-block path is left untouched.
;
; Values are checked at combat time, so equipment/stat changes are reflected
; without restarting the game.
AdaptivePriority=0

; Optional diagnostic logging for Adaptive Priority.
; Normally leave this at 0.
LogDecisions=0

[Animations]
; 0 = VanillaOnly
; 1 = Compatible
; 2 = CustomAllowList
AnimationMode=1
AllowedAnimations=
BlockedAnimations=
LogDiscoveredTechniques=0
LogSelectedAnimation=0

[Restrictions]
AllowInDefensiveMode=1
RequireNormalProneState=1
DodgeCooldownMs=0

[Logging]
Verbose=0
LogSelections=0
MaxLines=500
