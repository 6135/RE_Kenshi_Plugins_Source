[AreaGuard]
; Master switch.
Enabled=true

; Protection mode:
; 1 = All (Recommended)
; 2 = Friendly
; 3 = NonEnemy
ProtectionMode=1

; Reaction of a protected later target:
; 1 = NoReaction (Recommended)
; 2 = HitReaction
ProtectedReactionMode=1

; Used by ProtectionMode 2 and 3.
FactorInDisguises=true

; Detailed combat logging for troubleshooting.
DebugLogging=false
